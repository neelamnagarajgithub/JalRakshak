# Server Configuration
server.port=${SERVER_PORT:9000}

# Spring Data JPA
# Schema is managed by Flyway migrations (see src/main/resources/db/migration).
# ddl-auto=validate makes Hibernate check the JPA entity mapping against the
# Flyway-managed schema at startup instead of silently altering tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jalrakshak}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.jalrakshak.shared
spring.kafka.consumer.properties.spring.json.value.default.type=org.jalrakshak.shared.AlertEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=jalrakshak-alert-persistence

kafka.topic.measurements=${KAFKA_TOPIC_MEASUREMENTS:river.measurements.v1}
kafka.topic.alerts=${KAFKA_TOPIC_ALERTS:river.alerts.v1}

# Springdoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
